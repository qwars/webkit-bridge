[package]
name = "ewd-tui"
version = "0.1.0"
edition = "2024"
description = "TUI client for EWD (Emacs WebKit Daemon)"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
ewd-core = { path = "../ewd-core" }
