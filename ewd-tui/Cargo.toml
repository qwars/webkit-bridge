[package]
name = "ewd-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI for ewd-daemon - JavaScript development environment"
license = "MIT"

[[bin]]
name = "ewd-tui"
path = "src/main.rs"

[dependencies]
ewd-core = { path = "../ewd-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "process", "fs", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
notify = "7"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
tempfile = "3"
url = "2.5"
arboard = "3.4"
ansi-to-tui = "8.0.1"
ratatui-core = "0.1.2"
